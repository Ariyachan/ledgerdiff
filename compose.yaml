services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ledgerdiff
      POSTGRES_DB: ledgerdiff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - ledgerdiff_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerdiff -d ledgerdiff"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      DATABASE_URL: postgresql://ledgerdiff:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ledgerdiff
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      WEB_ORIGIN: http://localhost:4200
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledgerdiff_pg:
